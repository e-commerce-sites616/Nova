# Render Blueprint: New + > Blueprint in the Render dashboard, pick this repo, done.
# (You can also create a plain "Static Site" by hand with the same build command and publish directory.)
services:
  - type: web
    runtime: static
    name: nova
    buildCommand: npm ci && npm run check && npm run build
    staticPublishPath: dist
    autoDeploy: true
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      # - key: SITE_URL            # uncomment after you attach a custom domain, e.g. https://www.yourdomain.com
      #   value: https://www.yourdomain.com
    headers:
      # Vite fingerprints everything in /assets, so it can be cached for a year.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Videos and share images keep stable names, so cache them for a week.
      - path: /video/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /og.jpg
        name: Cache-Control
        value: public, max-age=86400
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
